# Metodo 2 - Linea base: maximo de gradiente por columna
#
# El enfoque convencional para un borde estructural horizontal: derivar, tomar el
# maximo por columna, filtrar el perfil. Se implemento primero, se midio, y su
# fracaso motivo la formulacion por camino optimo del metodo 1.
#
# Se conserva como linea base medible: sin ella, "el camino optimo es mejor" seria
# una opinion en vez de un 39 % menos de jitter a 1.56x el costo. El eje del
# benchmark es donde se impone el prior de continuidad — durante la busqueda o
# despues, mediante filtrado.
#
# Comparte con el metodo 1 preprocesado, exclusion de maquinaria y banda de
# busqueda, para que la comparacion aisle la formulacion.
#
# Ver reporte_benchmark.md seccion 4, y docs/adr/0006.

method: 2
name: "Linea base por argmax"
description: >
  Linea base de segmentacion del pretil por maximo de gradiente por columna con
  filtrado posterior. Mas rapida que el camino optimo y sustancialmente menos
  estable.

detector:
  weights: weights/detector_v1.pt
  # Umbral bajo a proposito: el tracker recupera detecciones debiles que uno mas
  # alto descartaria, y eso importa con polvo y de noche.
  confidence: 0.25
  iou: 0.45
  image_size: 640
  half_precision: true

lighting:
  # Calibrados sobre el material de muestra, cuya luminancia media recorre 19-163.
  # El set de evaluacion es ciego: su generalizacion es un supuesto declarado.
  night_max: 70.0
  day_min: 110.0

shots:
  luma_delta: 20.0
  min_length: 6

proximity:
  # Preliminares. La distancia de frenado de un CAEX cargado a 20 km/h ronda los
  # 30-40 m, de modo que los umbrales son conservadores. Pendiente justificarlos
  # contra la normativa en el reporte.
  caution_m: 20.0
  critical_m: 10.0
  # Histeresis asimetrica: escalar rapido es seguro, desescalar lento tambien.
  frames_to_escalate: 3
  frames_to_deescalate: 10

output:
  fourcc: mp4v
  draw_hud: true
