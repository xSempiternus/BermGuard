# Metodo 1 - Prior geometrico explicito
#
# Deteccion con un detector de una etapa y segmentacion del pretil por analisis
# de gradiente. Cada paso es auditable: un supervisor puede seguir por que se
# levanto una alerta, lo que en seguridad industrial tiene valor propio.
#
# Ver docs/adr/0002 (eleccion del detector) y docs/adr/0003 (tomas y luminancia).

method: 1
name: "Prior geometrico"
description: >
  Deteccion YOLO de una etapa y segmentacion del pretil por gradiente vertical
  con supresion por entropia. Rapido, determinista y explicable paso a paso.

detector:
  weights: weights/yolo11s.pt
  # Umbral bajo a proposito: el tracker recupera detecciones debiles que uno mas
  # alto descartaria, y eso importa con polvo y de noche.
  confidence: 0.25
  iou: 0.45
  image_size: 640
  half_precision: true

lighting:
  # Calibrados sobre el material de muestra, cuya luminancia media recorre 19-163.
  # El set de evaluacion es ciego: su generalizacion es un supuesto declarado.
  night_max: 70.0
  day_min: 110.0

shots:
  luma_delta: 20.0
  min_length: 6

proximity:
  # Preliminares. La distancia de frenado de un CAEX cargado a 20 km/h ronda los
  # 30-40 m, de modo que los umbrales son conservadores. Pendiente justificarlos
  # contra la normativa en el reporte.
  caution_m: 20.0
  critical_m: 10.0
  # Histeresis asimetrica: escalar rapido es seguro, desescalar lento tambien.
  frames_to_escalate: 3
  frames_to_deescalate: 10

output:
  fourcc: mp4v
  draw_hud: true
